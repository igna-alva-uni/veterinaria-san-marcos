server:
  port: 9003
  error:
    include-stacktrace: never

spring:
  application:
    name: ms-citas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/veterinaria}
    username: app_citas
    password: ${DB_CITAS_PASSWORD:${DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: citas

management:
  endpoint:
    health:
      show-components: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
