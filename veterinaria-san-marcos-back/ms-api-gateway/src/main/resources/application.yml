server:
  port: 9001
  error:
    include-stacktrace: never

spring:
  application:
    name: ms-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: usuarios
              uri: lb://ms-usuarios
              predicates:
                - Path=/api/v1/auth/**,/api/v1/usuarios/**
            - id: pacientes
              uri: lb://ms-pacientes
              predicates:
                - Path=/api/v1/pacientes/**
            - id: citas
              uri: lb://ms-citas
              predicates:
                - Path=/api/v1/citas/**,/api/v1/servicios/**
            - id: usuarios-openapi
              uri: lb://ms-usuarios
              predicates:
                - Path=/openapi/usuarios
              filters:
                - SetPath=/v3/api-docs
            - id: pacientes-openapi
              uri: lb://ms-pacientes
              predicates:
                - Path=/openapi/pacientes
              filters:
                - SetPath=/v3/api-docs
            - id: citas-openapi
              uri: lb://ms-citas
              predicates:
                - Path=/openapi/citas
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: Usuarios
        url: /openapi/usuarios
      - name: Pacientes
        url: /openapi/pacientes
      - name: Citas
        url: /openapi/citas

eureka:
  client:
    register-with-eureka: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
