server:
  port: 9002
  error:
    include-stacktrace: never

spring:
  application:
    name: ms-usuarios
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/veterinaria}
    username: app_usuarios
    password: ${DB_USUARIOS_PASSWORD:${DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: usuarios

management:
  endpoint:
    health:
      show-components: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
