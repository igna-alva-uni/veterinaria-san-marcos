server:
  port: 9002
  error:
    include-stacktrace: never

spring:
  application:
    name: ms-usuarios
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/veterinaria}
    username: app_usuarios
    password: ${DB_USUARIOS_PASSWORD:${DB_PASSWORD:}}
  autoconfigure:
    # No se usa el usuario en memoria de Spring Security: la autenticación es por JWT.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crean los scripts de init-multi-db. Usar JPA_DDL_AUTO=validate para contrastarlo.
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        default_schema: usuarios

jwt:
  # Misma clave en todos los microservicios; se define en .env (ver .env.example).
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

management:
  endpoint:
    health:
      show-components: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
